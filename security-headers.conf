# En-têtes de sécurité du site (inclus dans chaque bloc location : un add_header local annule l'héritage)
include /etc/nginx/snippets/security-headers-base.conf;
# Aucun script en ligne ni externe : seuls les fichiers servis par ce domaine s'exécutent
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
