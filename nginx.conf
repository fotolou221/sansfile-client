# Derrière le Nginx du VPS (qui termine le HTTPS), transmettre au backend le protocole d'origine :
# sinon Spring croit les requêtes en http (CORS refusé sur les POST, URLs d'images en http://).
# En accès direct (local), c'est le protocole de cette connexion.
map $http_x_forwarded_proto $sansfile_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de Nginx
    server_tokens off;

    # Téléversement des images produits / catégories depuis l'admin
    client_max_body_size 10m;

    # DNS Docker résolu à chaque requête : Nginx démarre même si le backend n'est pas encore prêt
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API REST et flux temps réel (SSE) -> backend Spring Boot (qui pose ses propres en-têtes de sécurité)
    location /api/ {
        set $backend http://sansfile-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sansfile_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Jamais en cache : sinon les mises à jour de la PWA n'arrivent pas aux utilisateurs
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(ngsw\.json|theme-init\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service workers de la PWA : ils récupèrent pour la page ses polices et images externes (Google Fonts,
    # Cloudinary, QR codes) avec fetch(), donc soumis à leur propre connect-src. Sans risque : ils ne chargent
    # que ce que les pages demandent, et le CSP des pages (img-src, font-src) reste strict.
    location ~ ^/(ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        include /etc/nginx/snippets/security-headers-base.conf;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; script-src 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Bundles Angular avec empreinte dans le nom (main-XXXXXXXX.js) : cache long
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routage Angular : toute URL de l'application renvoie index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
